[package]
name = "cashflow-rs"
version = "0.2.0"
edition = "2021"
description = "Расчёт платежей по телу и процентам по сделкам"

[lib]
name = "cashflow"
path = "src/lib.rs"

[[bin]]
name = "cfcalc"
path = "src/main.rs"

[[bin]]
name = "cfcalc-api"
path = "src/bin/cfcalc_api.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
axum = "0.8"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
ureq = { version = "2", default-features = false, features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
